<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <main>
        <h1>📱Basic HTML & CSS Knowledge Quiz</h1>

        <form action="">
            <div class="quiz-item">
                <label for="q1">1. What does HTML stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="quiz-item">
                <label for="q2">2. Explain the purpose of the CSS Box Model:</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <div class="quiz-item">
                <label for="q3">3. Which HTML element is used to create a hyperlink?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose one...</option>
                    <option value="a-tag">&lt;a&gt;</option>
                    <option value="link-tag">&lt;link&gt;</option>
                    <option value="href">href</option>
                </select>
            </div>

            <div class="quiz-item">
                <label for="q4">4. How many heading levels exist in HTML?</label>
                <input type="number" id="q4" name="q4" min="1" max="10" required>
            </div>
            <button type="submit">Submit Quiz</button>

        </form>
    </main>

</body>

</html>
