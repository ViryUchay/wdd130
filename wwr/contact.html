<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact White Water Rafting Company for inquiries, reservations, and customer support.">
    <meta name="author" content="Vivian Eze">

    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | White Water Rafting</title>
</head>

<body class="contact-page">

    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Site Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a class="active" href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">

        <h1>Contact Us</h1>

        <section class="contact-info">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </section>

        <section class="contact-grid">
            <h2 class="sr-only">Contact Section</h2>

            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15856.916945969611!2d3.34896815!3d6.492632599999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1764718864628!5m2!1sen!2sng"
                    allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <form class="contact-form">
                <div class="form-item">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-item">
                    <label>Message Purpose:</label>
                    <div class="radio-group">
                        <input type="radio" id="option1" name="purpose" value="General Inquiry" required>
                        <label for="option1">General Inquiry</label>

                        <input type="radio" id="option2" name="purpose" value="Reservation Question">
                        <label for="option2">Reservation Question</label>

                        <input type="radio" id="option3" name="purpose" value="Website Suggestion">
                        <label for="option3">Website Suggestion</label>
                    </div>
                </div>

                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-item">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>

                <div class="form-item">
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </section>

        <section class="employee-section">
            <h2>We are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Lead Guide">
                    <figcaption>Sam — Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Safety Coordinator">
                    <figcaption>Maria — Safety Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Customer Support">
                    <figcaption>Jordan — Customer Support</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 | The Rafting Company | Vivian Eze</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
